name: Move game to site root

on:
  workflow_dispatch:

jobs:
  move:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Move REALM_web contents to root
        run: |
          if [ -d REALM_web ]; then
            shopt -s dotglob
            mv REALM_web/* .
            rmdir REALM_web
          else
            echo "No REALM_web folder; game files are already at root."
          fi
          ls -la
      - name: Commit moved files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Move game files to site root" || echo "Nothing to commit"
          git push
